<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Move unit</title>
<link rel="stylesheet" href="https://js.arcgis.com/4.31/esri/themes/light/main.css">
<style>
  :root { --ink:#1b2430; --muted:#5b6675; --line:#c9d1dc; --accent:#b3361b; --accent-ink:#fff; --ok:#1d6b3a; --bad:#a11d1d; }
  * { box-sizing: border-box; }
  body { margin:0; padding:14px; font:16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:#fff; }
  h1 { font-size:18px; margin:0 0 12px; }
  h2 { font-size:16px; margin:22px 0 0; padding-top:14px; border-top:1.5px solid var(--line); }
  label { display:block; font-weight:600; margin:12px 0 4px; }
  select, input { width:100%; padding:11px 10px; font:inherit; border:1.5px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); }
  select:focus, input:focus, button:focus-visible { outline:3px solid #f1b04c; outline-offset:1px; }
  .hint { color:var(--muted); font-size:14px; margin:4px 0 0; }
  button { font:inherit; font-weight:600; cursor:pointer; border-radius:6px; }
  .primary { width:100%; margin-top:14px; padding:12px; border:0; background:var(--accent); color:var(--accent-ink); }
  .primary:disabled { opacity:.5; cursor:default; }
  #results { list-style:none; margin:14px 0 0; padding:0; }
  #results li { margin:0 0 8px; }
  #results button { width:100%; text-align:left; padding:11px 12px; border:1.5px solid var(--line); background:#fff; color:var(--ink); font-weight:500; }
  #results button:hover { border-color:var(--accent); }
  #status { margin-top:14px; min-height:1.4em; font-weight:600; }
  #status.ok { color:var(--ok); } #status.bad { color:var(--bad); }
</style>
</head>
<body>
<h1>Move unit</h1>

<label for="unit">Unit</label>
<select id="unit" disabled><option>Loading units…</option></select>

<h2>Move to a mapped feature</h2>
<label for="feature">Helispot or drop point</label>
<select id="feature" disabled><option>Loading features…</option></select>
<button id="moveFeature" class="primary" disabled>Move to feature</button>

<h2>Move to an address</h2>
<label for="place">New location</label>
<input id="place" type="text" autocomplete="off" placeholder="18th St &amp; Irvine Ave, Clearlake CA" disabled>
<p class="hint">Street address, cross streets with the city, or latitude, longitude.</p>
<button id="find" class="primary" disabled>Find location</button>

<ul id="results"></ul>
<div id="status" role="status" aria-live="polite"></div>

<script src="https://js.arcgis.com/4.31/"></script>
<script>
/* ===== EDIT THESE ===== */
const CONFIG = {
  // Your units layer: REST URL ending in /FeatureServer/0 (or the layer number)
  layerUrl: "https://services8.arcgis.com/im2wMQ93z5AFliYf/arcgis/rest/services/MEDICAL_RESOURCES/FeatureServer/0",
  // Field holding each unit's name (what shows in the dropdown)
  nameField: "ResourceID",
  // Date field to stamp with the time of each move. Set to null to skip.
  lastUpdatedField: "null",
  // Optional [longitude, latitude] near the incident. Ranks nearby address matches first.
  searchCenter: null,
  // Optional: limit the unit dropdown, e.g. "UnitType = 'AMB'". Use "1=1" for all.
  unitFilter: "1=1",
  // Mapped features units can be moved to. Add more lines to add more layers.
  featureLayers: [
    { label: "Helispots",   nameField: "Label", url: "https://services8.arcgis.com/im2wMQ93z5AFliYf/arcgis/rest/services/Helispots_ExportFeatures_n/FeatureServer/0" },
    { label: "Drop Points", nameField: "Label", url: "https://services8.arcgis.com/im2wMQ93z5AFliYf/arcgis/rest/services/DropPoints_ExportFeatures_n/FeatureServer/0" },
    { label: "ICP",         nameField: "FeatureCategory", url: "https://services8.arcgis.com/im2wMQ93z5AFliYf/arcgis/rest/services/ICP_ExportFeatures/FeatureServer/0" },
    { label: "Badger Camp", nameField: "FeatureCategory", url: "https://services8.arcgis.com/im2wMQ93z5AFliYf/arcgis/rest/services/BadgerCamp_ExportFeatures/FeatureServer/0" }
  ]
};
const GEOCODER = "https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer";
/* ====================== */

require([
  "esri/layers/FeatureLayer", "esri/rest/locator", "esri/geometry/Point",
  "esri/geometry/support/webMercatorUtils", "esri/Graphic", "esri/identity/IdentityManager"
], function (FeatureLayer, locator, Point, webMercatorUtils, Graphic, esriId) {

  const $ = id => document.getElementById(id);
  const unitSel = $("unit"), featSel = $("feature"), featBtn = $("moveFeature"),
        place = $("place"), findBtn = $("find"), results = $("results"), statusEl = $("status");
let layer, oidField, units = [], features = [];

  // Remember the sign-in for this browser tab so a reload does not ask again
  const CRED_KEY = "moveUnitSignIn";
  function saveCreds() {
    try { sessionStorage.setItem(CRED_KEY, JSON.stringify(esriId.toJSON())); } catch (e) {}
  }
  try {
    const saved = sessionStorage.getItem(CRED_KEY);
    if (saved) esriId.initialize(JSON.parse(saved));
  } catch (e) {}
  window.addEventListener("pagehide", saveCreds);
  document.addEventListener("visibilitychange", saveCreds);
  setInterval(saveCreds, 10000);

  function say(msg, kind) { statusEl.textContent = msg; statusEl.className = kind || ""; }

  async function init() {
    try {
      layer = new FeatureLayer({ url: CONFIG.layerUrl });
      await layer.load();               // prompts for sign-in if the layer is private
      oidField = layer.objectIdField;
      if (!layer.capabilities.operations.supportsUpdate) {
        say("This layer does not allow editing. Turn on editing in the layer settings.", "bad"); return;
      }
      await loadUnits();
      unitSel.disabled = place.disabled = findBtn.disabled = false;
      say("");
    } catch (e) { say("Could not open the layer: " + (e.message || e), "bad"); return; }
    await loadFeatures();
  }

  async function loadUnits() {
    const r = await layer.queryFeatures({
      where: CONFIG.unitFilter, outFields: [oidField, CONFIG.nameField],
      returnGeometry: false, orderByFields: [CONFIG.nameField]
    });
    units = r.features.map(f => ({ oid: f.attributes[oidField], name: f.attributes[CONFIG.nameField] }));
    unitSel.innerHTML = "";
    units.forEach((u, i) => unitSel.add(new Option(u.name, i)));
    if (!units.length) say("No units found. Check unitFilter and nameField in the page settings.", "bad");
  }

  // Load helispots, drop points, etc. A layer that fails to load is skipped, not fatal.
  async function loadFeatures() {
    featSel.innerHTML = ""; features = [];
    const failed = [];
    for (const cfg of CONFIG.featureLayers) {
      try {
        const fl = new FeatureLayer({ url: cfg.url });
        await fl.load();
        const r = await fl.queryFeatures({
          where: "1=1", outFields: [cfg.nameField], returnGeometry: true,
          outSpatialReference: layer.spatialReference, orderByFields: [cfg.nameField]
        });
        const group = document.createElement("optgroup");
        group.label = cfg.label;
        r.features.forEach(f => {
          const g = f.geometry; if (!g) return;
          const pt = g.type === "point" ? g : (g.centroid || g.extent.center);
          const name = f.attributes[cfg.nameField] || "(no name)";
          features.push({ name, group: cfg.label, point: pt });
          group.appendChild(new Option(name, features.length - 1));
        });
        if (group.children.length) featSel.appendChild(group);
      } catch (e) { failed.push(cfg.label); }
    }
    if (!features.length) {
      featSel.innerHTML = "<option>No features available</option>";
    } else {
      featSel.disabled = featBtn.disabled = false;
    }
    if (failed.length) say("Could not load: " + failed.join(", ") + ". Check that you have access to those layers.", "bad");
  }

  // Latitude, longitude typed directly, e.g. "38.9582, -122.6264"
  function parseLatLon(text) {
    const m = text.trim().match(/^(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)$/);
    if (!m) return null;
    let a = parseFloat(m[1]), b = parseFloat(m[2]);
    if (Math.abs(a) > 90) [a, b] = [b, a];          // accept lon, lat order too
    if (Math.abs(a) > 90 || Math.abs(b) > 180) return null;
    return { lat: a, lon: b };
  }

  async function find() {
    results.innerHTML = ""; say("");
    const text = place.value.trim();
    if (!text) { say("Type a location first.", "bad"); return; }
    findBtn.disabled = true; say("Searching…");
    try {
      let matches;
      const ll = parseLatLon(text);
      if (ll) {
        matches = [{ label: ll.lat.toFixed(5) + ", " + ll.lon.toFixed(5), lon: ll.lon, lat: ll.lat }];
      } else {
        const params = { address: { SingleLine: text }, maxLocations: 5, countryCode: "USA", forStorage: true };
        if (CONFIG.searchCenter) params.location = new Point({ longitude: CONFIG.searchCenter[0], latitude: CONFIG.searchCenter[1] });
        const cred = esriId.findCredential(CONFIG.layerUrl);
        const c = await locator.addressToLocations(GEOCODER, params, cred ? { query: { token: cred.token } } : {});
        matches = c.map(x => ({ label: x.address, lon: x.location.longitude, lat: x.location.latitude, score: x.score }));
      }
      if (!matches.length) { say("No match. Add the city and state, or try cross streets.", "bad"); return; }
      say("Tap the correct location to move " + unitSel.selectedOptions[0].text + ".");
      matches.forEach(m => {
        const li = document.createElement("li"), b = document.createElement("button");
        b.type = "button"; b.textContent = m.label; b.onclick = () => moveToLonLat(m);
        li.appendChild(b); results.appendChild(li);
      });
    } catch (e) { say("Search failed: " + (e.message || e), "bad"); }
    finally { findBtn.disabled = false; }
  }

  // Write a new geometry (already in the units layer's coordinate system) to the selected unit.
  async function saveMove(geom, label) {
    const u = units[unitSel.value];
    if (!u) { say("Pick a unit first.", "bad"); return; }
    const attributes = { [oidField]: u.oid };
    if (CONFIG.lastUpdatedField) attributes[CONFIG.lastUpdatedField] = Date.now();
    say("Moving " + u.name + "…");
    try {
      const res = await layer.applyEdits({ updateFeatures: [new Graphic({ geometry: geom, attributes })] });
      const err = res.updateFeatureResults[0] && res.updateFeatureResults[0].error;
      if (err) throw new Error(err.message);
      const t = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      say(u.name + " moved to " + label + " at " + t + ".", "ok");
      results.innerHTML = ""; place.value = "";
    } catch (e) { say("Move failed: " + (e.message || e), "bad"); }
  }

  function moveToLonLat(m) {
    const sr = layer.spatialReference;
    let geom = new Point({ longitude: m.lon, latitude: m.lat, spatialReference: { wkid: 4326 } });
    if (sr.isWebMercator) geom = webMercatorUtils.geographicToWebMercator(geom);
    else if (!sr.isWGS84) { say("Layer uses a coordinate system this page does not support.", "bad"); return; }
    saveMove(geom, m.label);
  }

  function moveToFeature() {
    const f = features[featSel.value];
    if (!f) { say("Pick a helispot or drop point first.", "bad"); return; }
    saveMove(f.point, f.name + " (" + f.group.replace(/s$/, "") + ")");
  }

  findBtn.addEventListener("click", find);
  featBtn.addEventListener("click", moveToFeature);
  place.addEventListener("keydown", e => { if (e.key === "Enter") find(); });
  init();
});
</script>
</body>
</html>
